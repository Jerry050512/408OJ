<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ site.title }}{% endblock %} · {{ site.title }}</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/css/design.css?v=2">
<script>
// 主题初始化（避免闪烁）
(function(){
  var t = localStorage.getItem('oj-theme') || 'dark';
  document.documentElement.setAttribute('data-theme', t);
})();
window.STATIC_MODE = {{ 'true' if STATIC_MODE else 'false' }};
</script>
{% block head %}{% endblock %}
</head>
<body>
<nav class="topnav">
  <div class="topnav-inner">
    <a class="brand" href="/">
      <svg class="logo" viewBox="0 0 26 26" aria-hidden="true"><rect width="26" height="26" rx="5" fill="#1f6feb"/><text x="13" y="17.5" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="11.5" font-weight="700" fill="#fff">41</text></svg>
      <span>408<b style="color:var(--accent)">OJ</b></span>
    </a>
    <a class="nav-link {{ 'active' if page=='home' }}" href="/">首页</a>
    <a class="nav-link {{ 'active' if page=='problems' }}" href="/problems">题库</a>
    <a class="nav-link {{ 'active' if page=='submissions' }}" href="/submissions">提交记录</a>
    <a class="nav-link {{ 'active' if page=='stats' }}" href="/stats">学习统计</a>
    <div class="nav-spacer"></div>
    <span class="nav-note">local · gcc c11</span>
    <button class="icon-btn" id="themeBtn" title="切换主题" aria-label="切换主题">
      <svg id="iconSun" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>
      <svg id="iconMoon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="display:none"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </div>
</nav>
<main class="container">
{% block content %}{% endblock %}
</main>
<footer class="footer">
  <span>408OJ · 数据结构算法大题训练场</span>
  <span class="mono">logo 的 41 = 数据结构算法设计大题题号 · 2012–2026 · 本地/前端评测</span>
</footer>
<script src="/static/js/policy.js"></script>
<script src="/static/js/store.js"></script>
<script src="/static/js/app.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>

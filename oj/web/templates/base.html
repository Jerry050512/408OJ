<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ site.title }}{% endblock %} · {{ site.title }}</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/css/design.css">
<script>
// 主题初始化（避免闪烁）
(function(){
  var t = localStorage.getItem('oj-theme') || 'dark';
  document.documentElement.setAttribute('data-theme', t);
})();
</script>
{% block head %}{% endblock %}
</head>
<body>
<nav class="topnav">
  <div class="topnav-inner">
    <a class="brand" href="/">
      <svg class="logo" viewBox="0 0 32 32" fill="none"><rect x="2" y="2" width="28" height="28" rx="8" fill="url(#g1)"/><path d="M10 22V10h4.4c2.4 0 4.1 1.2 4.1 3.2 0 1.5-.9 2.6-2.3 3L19 22h-3.3l-2.4-5.4H13V22h-3zm3-7.8h1.2c1.1 0 1.8-.5 1.8-1.3s-.7-1.3-1.8-1.3H13v2.6z" fill="#fff"/><defs><linearGradient id="g1" x1="2" y1="2" x2="30" y2="30"><stop stop-color="#6c6ff2"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient></defs></svg>
      <span><span class="num">408</span>OJ</span>
    </a>
    <a class="nav-link {{ 'active' if page=='home' }}" href="/">首页</a>
    <a class="nav-link {{ 'active' if page=='problems' }}" href="/problems">题库</a>
    <a class="nav-link {{ 'active' if page=='submissions' }}" href="/submissions">提交记录</a>
    <a class="nav-link {{ 'active' if page=='stats' }}" href="/stats">学习统计</a>
    <div class="nav-spacer"></div>
    <span class="badge" style="border:none;background:transparent;color:var(--text-3)">
      <span class="pulse"></span>本地评测已就绪
    </span>
    <button class="icon-btn" id="themeBtn" title="切换主题" aria-label="切换主题">
      <svg id="iconSun" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>
      <svg id="iconMoon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="display:none"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </div>
</nav>
<main class="container">
{% block content %}{% endblock %}
</main>
<footer class="footer">
  <div><b>408OJ</b> · 面向 408 数据结构算法大题的本地训练场 · GCC 评测 · 题解/考点/真题</div>
</footer>
<script src="/static/js/app.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
